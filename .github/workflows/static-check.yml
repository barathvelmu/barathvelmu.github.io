name: static blocks in sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate static blocks
        run: node build-static.js
      - name: Fail if index.html was committed out of sync with publications.json
        run: |
          if ! git diff --exit-code -- index.html; then
            echo "::error::index.html is out of sync with publications.json. Run 'node build-static.js' and commit the result."
            exit 1
          fi
